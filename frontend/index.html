<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UE-26</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="urna">

    <div class="tela">

        <div class="cabecalho">
            <h1>UE-26</h1>
            <span>SIMULADOR DE VOTAÇÃO</span>
        </div>

        <div class="cargo">
            <h2 id="cargo">DEPUTADO(A) FEDERAL</h2>
        </div>

        <div class="conteudo">

            <div class="numero-area">

                <p>SEU VOTO</p>

                <div id="numero" class="numero">
                    _
                </div>

                <div id="mensagem" class="mensagem">
                    DIGITE O NÚMERO
                </div>

            </div>

            <div id="candidato" class="candidato">

                <div class="foto">
                    FOTO
                </div>

                <div class="dados">

                    <h2 id="nome">
                        -
                    </h2>

                    <p>
                        Nº <strong id="numeroCandidato">-</strong>
                    </p>

                    <p id="vice">
                        -
                    </p>

                </div>

            </div>

        </div>

    </div>


    <div class="teclado">

        <div class="numeros">

            <button onclick="digitar(1)">1</button>
            <button onclick="digitar(2)">2</button>
            <button onclick="digitar(3)">3</button>

            <button onclick="digitar(4)">4</button>
            <button onclick="digitar(5)">5</button>
            <button onclick="digitar(6)">6</button>

            <button onclick="digitar(7)">7</button>
            <button onclick="digitar(8)">8</button>
            <button onclick="digitar(9)">9</button>

            <button class="zero" onclick="digitar(0)">0</button>

        </div>


        <div class="acoes">

            <button class="corrige" onclick="corrigir()">
                CORRIGE
            </button>

            <button class="branco" onclick="branco()">
                BRANCO
            </button>

            <button class="confirma" onclick="confirmar()">
                CONFIRMA
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
